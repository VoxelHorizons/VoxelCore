name: VoxelCore MVP Smoke Tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  smoke:
    name: Minecraft ${{ matrix.minecraft }} MVP smoke
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft: '1.12.2'
            module: voxelcore-v1_12
            image: itzg/minecraft-server:java8
            server_type: SPIGOT
            fixture_root: mvp-content-legacy
          - minecraft: '1.13.2'
            module: voxelcore-v1_12
            image: itzg/minecraft-server:java8
            server_type: SPIGOT
            fixture_root: mvp-content-legacy
          - minecraft: '1.14.4'
            module: voxelcore-v1_14
            image: itzg/minecraft-server:java8
            server_type: SPIGOT
            fixture_root: mvp-content
          - minecraft: '1.19.4'
            module: voxelcore-v1_19_4
            image: itzg/minecraft-server:java17
            server_type: PAPER
            fixture_root: mvp-content
          - minecraft: '1.20.5'
            module: voxelcore-v1_20_5
            image: itzg/minecraft-server:java21
            server_type: PAPER
            fixture_root: mvp-content
          - minecraft: '1.21.4'
            module: voxelcore-v1_21_4
            image: itzg/minecraft-server:java21
            server_type: PAPER
            fixture_root: mvp-content-modern
          - minecraft: '26.2'
            module: voxelcore-v26_2
            image: itzg/minecraft-server:java25
            server_type: PAPER
            fixture_root: mvp-content-modern

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Build target distribution
        run: mvn -U -pl "${{ matrix.module }}" -am package

      - name: Run real-server MVP smoke test
        run: bash .github/scripts/mvp-smoke.sh "${{ matrix.minecraft }}" "${{ matrix.module }}" "${{ matrix.image }}" "${{ matrix.server_type }}" "${{ matrix.fixture_root }}"

      - name: Upload smoke server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.minecraft }}-server-data
          path: .smoke/${{ matrix.minecraft }}/logs/
          if-no-files-found: ignore
