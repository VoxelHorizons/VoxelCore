name: Discord - Published VoxelCore Releases

on:
  release:
    types: [published]

# No repository token is required to post to Discord.
permissions: {}

jobs:
  announce:
    if: github.event.release.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Notify VoxelCore Updates on Discord
        env:
          DISCORD_RELEASE_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          raw_url = os.environ.get("DISCORD_RELEASE_WEBHOOK_URL", "").strip().rstrip("/")
          if not raw_url:
              raise SystemExit("Missing repository Actions secret DISCORD_RELEASE_WEBHOOK_URL")

          # The user's Discord webhook may be the GitHub-specific /github endpoint.
          # This workflow posts a Discord message, not a GitHub event payload.
          url = raw_url.removesuffix("/github")
          parsed = urllib.parse.urlsplit(url)
          if (
              parsed.scheme != "https"
              or parsed.hostname not in ("discord.com", "discordapp.com")
              or not re.fullmatch(r"/api/webhooks/\d+/[A-Za-z0-9._-]+", parsed.path)
              or parsed.query
              or parsed.fragment
          ):
              raise SystemExit("Secret must contain a valid Discord webhook URL (optionally ending in /github)")

          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as source:
              event = json.load(source)
          release = event.get("release") or {}
          if event.get("action") != "published" or release.get("draft"):
              print("Not a newly published release; no notification sent.")
              raise SystemExit(0)
          if (event.get("repository") or {}).get("full_name") != "VoxelHorizons/VoxelCore":
              raise SystemExit("Unexpected release repository; refusing notification")

          tag = (release.get("tag_name") or "").strip()
          release_url = (release.get("html_url") or "").strip()
          if not tag or not release_url.startswith("https://github.com/VoxelHorizons/VoxelCore/releases/"):
              raise SystemExit("Release metadata is missing or invalid")
          title = (release.get("name") or f"VoxelCore {tag}").strip()[:256]
          notes = (release.get("body") or "").strip()
          if not notes:
              notes = "View the release page for details and downloads."
          if len(notes) > 3750:
              notes = notes[:3749] + "…"

          message = {
              "username": "VoxelCore Updates",
              "allowed_mentions": {"parse": []},
              "embeds": [{
                  "title": title,
                  "url": release_url,
                  "description": notes,
                  "color": 0x29A8D8,
                  "fields": [
                      {"name": "Version", "value": tag[:1024], "inline": True},
                      {"name": "Release type", "value": "Pre-release" if release.get("prerelease") else "Stable", "inline": True},
                  ],
                  "footer": {"text": "VoxelHorizons • VoxelCore"},
              }],
          }
          request = urllib.request.Request(
              url,
              data=json.dumps(message, ensure_ascii=False).encode("utf-8"),
              headers={"Content-Type": "application/json", "User-Agent": "VoxelHorizons-Release-Notifier"},
              method="POST",
          )
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  if response.status not in (200, 204):
                      raise SystemExit(f"Discord returned HTTP {response.status}")
          except urllib.error.HTTPError as exc:
              # Deliberately don't log the exception URL: it contains the webhook token.
              raise SystemExit(f"Discord rejected the announcement (HTTP {exc.code})") from None
          except urllib.error.URLError:
              raise SystemExit("Could not connect to Discord webhook") from None
          print(f"Discord notification delivered for VoxelCore {tag}")
          PY
