name: Build VoxelCore Distributions

on:
  push:
    branches:
      - main
      - 'chore/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Build all distributions
        run: mvn -U clean package

      - name: Verify distribution API metadata
        shell: bash
        run: |
          set -euo pipefail
          verify_api_version() {
            local jar_pattern="$1"
            local expected="$2"
            local jar
            jar=$(compgen -G "$jar_pattern" | head -n 1)
            test -n "$jar"
            unzip -p "$jar" plugin.yml | grep -Fx "api-version: '$expected'"
            local provider
            provider=$(unzip -p "$jar" META-INF/services/org.voxelhorizons.platform.PlatformProvider)
            test -n "$provider"
            local provider_class="${provider//.//}.class"
            unzip -l "$jar" "$provider_class" | grep -F "$provider_class"
          }
          verify_api_version 'voxelcore-v1_12/target/VoxelCore-*.jar' '1.13'
          verify_api_version 'voxelcore-v1_14/target/VoxelCore-*.jar' '1.14'
          verify_api_version 'voxelcore-v1_19_4/target/VoxelCore-*.jar' '1.19'
          verify_api_version 'voxelcore-v1_20_5/target/VoxelCore-*.jar' '1.20.5'
          verify_api_version 'voxelcore-v1_21_4/target/VoxelCore-*.jar' '1.21.4'
          verify_api_version 'voxelcore-v26_2/target/VoxelCore-*.jar' '26.2'
          verify_api_version 'voxelcore-v26_3/target/VoxelCore-*.jar' '26.3'

      - name: Verify browser classes in shaded distributions
        shell: bash
        run: |
          set -euo pipefail
          # A 26.3 runtime crashed on /vc admin item ui because ContentBrowser$1
          # (an anonymous comparator) was missing. Validate the shipped JAR, not
          # merely the unshaded voxelcore-plugin module.
          for module in voxelcore-v1_12 voxelcore-v1_14 voxelcore-v1_19_4 voxelcore-v1_20_5 voxelcore-v1_21_4 voxelcore-v26_2 voxelcore-v26_3; do
            jar=$(find "$module/target" -maxdepth 1 -name "VoxelCore-*.jar" -print -quit)
            test -n "$jar"
            for class in 'ContentBrowser.class' 'ContentBrowser$Type.class' 'ContentBrowser$BrowserHolder.class'; do
              entry="org/voxelhorizons/command/ui/$class"
              unzip -Z1 "$jar" | grep -Fx "$entry"
            done
          done

      - name: Upload Minecraft 1.12-1.13 artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoxelCore-mc1.12-1.13
          path: voxelcore-v1_12/target/VoxelCore-*.jar

      - name: Upload Minecraft 1.14-1.19.3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoxelCore-mc1.14-1.19.3
          path: voxelcore-v1_14/target/VoxelCore-*.jar

      - name: Upload Minecraft 1.19.4-1.20.4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoxelCore-mc1.19.4-1.20.4
          path: voxelcore-v1_19_4/target/VoxelCore-*.jar

      - name: Upload Minecraft 1.20.5-1.21.3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoxelCore-mc1.20.5-1.21.3
          path: voxelcore-v1_20_5/target/VoxelCore-*.jar

      - name: Upload Minecraft 1.21.4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoxelCore-mc1.21.4
          path: voxelcore-v1_21_4/target/VoxelCore-*.jar

      - name: Upload Minecraft 26.3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoxelCore-mc26.3
          path: voxelcore-v26_3/target/VoxelCore-*.jar

      - name: Upload Minecraft 26.2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoxelCore-mc26.2
          path: voxelcore-v26_2/target/VoxelCore-*.jar

      - name: Publish snapshot release from main
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-SNAPSHOT
          name: VoxelCore v1.0-SNAPSHOT
          prerelease: true
          files: |
            voxelcore-v1_12/target/VoxelCore-*.jar
            voxelcore-v1_14/target/VoxelCore-*.jar
            voxelcore-v1_19_4/target/VoxelCore-*.jar
            voxelcore-v1_20_5/target/VoxelCore-*.jar
            voxelcore-v1_21_4/target/VoxelCore-*.jar
            voxelcore-v26_2/target/VoxelCore-*.jar
            voxelcore-v26_3/target/VoxelCore-*.jar
