name: Prepare VoxelCore Release Draft

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag vX.Y.Z or vX.Y.Z-rc.N
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/main' && github.actor == 'Fibbicles'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      commit: ${{ steps.version.outputs.commit }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify existing tag, main ancestry, and Maven release version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]] || { echo 'Invalid release tag'; exit 1; }
          git fetch --tags origin
          COMMIT=$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")
          git merge-base --is-ancestor "$COMMIT" origin/main || { echo 'Tag is not on main'; exit 1; }
          VERSION="${RELEASE_TAG#v}"
          POM_VERSION=$(git show "$COMMIT:pom.xml" | python3 -c 'import sys,xml.etree.ElementTree as ET; r=ET.fromstring(sys.stdin.read()); print(r.find("{http://maven.apache.org/POM/4.0.0}version").text)')
          [[ "$POM_VERSION" == "$VERSION" ]] || { echo "Version mismatch: tag $VERSION, POM $POM_VERSION"; exit 1; }
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build and test tagged source
        run: mvn -B --no-transfer-progress clean verify
      - name: Audit tagged release JAR contents
        run: python3 .github/scripts/audit-release-dependencies.py

      - name: Assemble plugin distributions, Geyser extension, and hashes
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for module in voxelcore-v1_12 voxelcore-v1_14 voxelcore-v1_19_4 voxelcore-v1_20_5 voxelcore-v1_21_4 voxelcore-v26_2 voxelcore-v26_3; do
            mapfile -t jars < <(find "$module/target" -maxdepth 1 -type f -name "VoxelCore-${RELEASE_VERSION}-mc*.jar")
            [[ "${#jars[@]}" -eq 1 ]] || { echo "Expected one JAR in $module"; exit 1; }
            cp "${jars[0]}" dist/
          done
          EXTENSION="voxelcore-geyser-extension/target/VoxelCore-GeyserExtension-${RELEASE_VERSION}.jar"
          [[ -s "$EXTENSION" ]] || { echo 'Missing Geyser extension'; exit 1; }
          cp "$EXTENSION" dist/
          [[ "$(find dist -maxdepth 1 -name '*.jar' | wc -l)" -eq 8 ]] || exit 1
          (cd dist && sha256sum ./*.jar > SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-candidate
          path: dist/
          if-no-files-found: error
          retention-days: 7

  create-draft:
    needs: [validate, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-candidate
          path: dist
      - name: Create draft release only after artifact and tag verification
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
          EXPECTED_COMMIT: ${{ needs.validate.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c SHA256SUMS
          compgen -G '*.jar' >/dev/null
          if gh release view "$RELEASE_TAG" -R "$GH_REPO" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to overwrite'
            exit 1
          fi
          OBJECT=$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" --jq '.object.sha + " " + .object.type')
          TAG_SHA="${OBJECT%% *}"
          if [[ "${OBJECT##* }" == 'tag' ]]; then
            TAG_SHA=$(gh api "repos/$GH_REPO/git/tags/$TAG_SHA" --jq '.object.sha')
          fi
          [[ "$TAG_SHA" == "$EXPECTED_COMMIT" ]] || { echo 'Tag moved after build'; exit 1; }
          FLAGS=(--draft --verify-tag --generate-notes --latest=false)
          [[ "$RELEASE_TAG" == *-rc.* ]] && FLAGS+=(--prerelease)
          gh release create "$RELEASE_TAG" ./*.jar ./SHA256SUMS -R "$GH_REPO" "${FLAGS[@]}"
