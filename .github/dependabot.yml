# Scheduled review-only dependency update proposals.
# No automatic merges, version bumps, releases or secret access are granted.
version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Australia/Melbourne"
    open-pull-requests-limit: 5
    groups:
      maven-build-plugins:
        patterns:
          - "org.apache.maven.plugins:*"
    # Paper API versions track specific Minecraft server lines, not latest semver.
    # Keep 26.2 and 26.3 API pins independent; audit security updates manually.
    ignore:
      - dependency-name: "io.papermc.paper:paper-api"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Australia/Melbourne"
    open-pull-requests-limit: 3
    groups:
      github-owned-actions:
        patterns:
          - "actions/*"
