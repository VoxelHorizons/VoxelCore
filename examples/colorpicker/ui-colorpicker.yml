# Copy into your existing voxel content pack's content/ui-colorpicker.yml.
# The nine image files live at assets/voxel/textures/ui/colorpicker/<palette>.png.
# GUI glyphs work only when the Java resource pack is built and loaded.
# Each texture is the corresponding 176x138 image supplied with the feature.
