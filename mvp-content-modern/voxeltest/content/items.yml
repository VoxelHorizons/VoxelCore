items:
  base:
    material: minecraft:diamond_hoe
    display_name: Base Modern MVP Item
    bound: true
    lore:
      - Loaded from the VoxelCore structured modern MVP fixture

  red_item:
    extends: base
    display_name: Red Test Item
    render:
      model: voxeltest:item/red_item
      unbreakable: true
      durability: 1
      attributes:
        hide_enchantments: true
        hide_attributes: true
        hide_unbreakable: true
        hide_potion_effects: true
      custom_model_data:
        variant: red
        powered: true
        intensity: 0.75
        tint: '#ff0000'
      rule:
        select:
          key: variant
          cases:
            red:
              condition:
                key: powered
                true:
                  range:
                    key: intensity
                    entries:
                      '0.25':
                        model:
                          id: voxeltest:item/red_powered
                          tint: tint
                      '0.75':
                        model:
                          id: voxeltest:item/red_powered_high
                          tint: tint
                    fallback: voxeltest:item/red_item
                false: voxeltest:item/red_item
          fallback: voxeltest:item/red_item
    events:
      interact:
        right:
          actions:
            - type: set_block
              block: red_ore
              target: relative
              replace: air_only
              consume: 1

  child_item:
    extends: red_item
    display_name: Inherited Test Item
    bound: false

blocks:
  red_ore:
    method: auto
    model: cube_all
    texture: voxeltest:item/red_item
    drop: red_item
    silk_touch: red_item
    hardness: 3.0
    blast_resistance: 3.0
