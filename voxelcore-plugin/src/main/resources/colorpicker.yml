# VoxelCore colour picker - values sampled from the nine supplied UI textures.
# Separate file so palettes, texts, slots and styling can be edited without rebuilding.
# Run /vc admin reload after changing this file. All slots are top-inventory indices (0-based).
enabled: true
size: 54  # Six chest rows, nine columns. Supports Java and Geyser/Bedrock.
input-slot: 19
output-slot: 25
shade-slots: [36, 37, 38, 39, 40, 41, 42, 43, 44]

# One resource-pack background for every palette on Java and Bedrock.
# Install the sample UI glyph 'colorpicker_background' in your VoxelCore pack.
# Switching palettes now updates tinted item icons without reopening the GUI.
title: '&f:offset_-8::colorpicker_background:'

buttons:
  # Install examples/colorpicker/content/colorpicker.yml and its two layered
  # models in your existing voxel pack, then switch both settings to:
  # color-material: 'voxel:ui/colorpicker/slot'
  # selected-shade-material: 'voxel:ui/colorpicker/selected'
  # Authored content item keys are ui-colorpicker_slot and
  # ui-colorpicker_selected; slash-style model IDs resolve to those names.
  # Direct item IDs voxel:ui-colorpicker_slot / voxel:ui-colorpicker_selected
  # work as well and are useful when diagnosing missing content packs.
  # Their original slot.png / selected.png are used directly (one PNG each).
  # Each model selectively tints its centre, white inner rim and bottom shade
  # via tintindex 0, while leaving the outer black/grey selected border neutral.
  # The selected model is used for BOTH the active primary palette and shade.
  # Vanilla FIREWORK_STAR is the safe initial fallback if the optional
  # content-pack item definitions have not been installed yet.
  color-material: FIREWORK_STAR
  selected-shade-material: ''
  # Editable primary-colour button text. '' makes the visible name blank.
  color-name: '&f{name}'
  # [] or '' removes all lore (including existing custom icon lore).
  # Supports multiple lines, & formatting, {palette}, {name} and {hex}.
  color-lore:
    - '&7{hex}'
  # Editable per-shade button text. '' also works here.
  shade-name: '&f{name} &7- &f{hex}'
  shade-lore:
    - '&7{hex}'
  # Set to '' to remove the selected-item prefix as well.
  selected-prefix: '&e▶ '

messages:
  disabled: '&cThe color picker is disabled.'
  unsupported: '&cRGB custom item dyeing requires Minecraft 1.21.4+.'
  invalid-item: '&cPlace one dyeable VoxelCore item in the input.'
  no-input: '&cPlace a dyeable item in the input slot.'
  clear-cursor: '&cEmpty your cursor before collecting the result.'
  inventory-full: '&cMake room in your inventory first.'
  painted: '&aItem recoloured to {hex}.'

# Primary grid matches your reference: red / orange / yellow,
# magenta / white / purple, green / cyan / blue.
# Each entry has its own configurable primary-button slot, hex and 1-9 shades.
# button-color sets the exact hex of the PRIMARY 3x3 palette button, independent
# of its shades. Existing primary button colours are retained by default.
# shades are ordered LIGHTEST -> DARKEST, left to right in shade-slots.
# Their order is preserved as authored (no automatic runtime sorting).
# When switching palettes, the first (lightest) shade is selected by default.
# Selecting a shade updates the output preview. Taking the output applies it.
palettes:
  red:
    name: 'Red'
    slot: 12
    button-color: '#991E1E'
    shades: ['#BF9999', '#B87575', '#99371E', '#7A4949', '#991E37', '#991E1E', '#6B1515', '#4C1B15', '#3A2525']
