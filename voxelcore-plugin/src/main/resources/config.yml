version: 9 # DO NOT CHANGE
game:
  bedrock_support: false # Build Bedrock resources alongside the current-server Java pack

resource_pack:
  host:
    # Serves the latest successfully built pack at /resourcepack.zip.
    enabled: false
    bind_address: '0.0.0.0'
    port: 24464
    # Logs every GET/HEAD request with remote address, response status, and bytes sent.
    debug: true
    # Set this to the public IP/DNS name players can reach. Leave blank to use server-ip.
    public_host: ''
    # Optional external base URL, useful behind a TLS reverse proxy (example: https://packs.example.com).
    # When set, it takes precedence over public_host/protocol/port.
    public_url: ''
    protocol: 'http'
  players:
    # Request the currently hosted pack when a player joins.
    send_on_join: false
    # Re-request the newly built pack for online players after /vc admin pack build.
    send_on_build: true
    # Kick players who decline the pack or fail to download/reload it.
    required: false
    # Shown with clients that support a custom resource-pack prompt.
    prompt: '&6Voxel Horizons resource pack'
    failure_kick_message: '&cYou must accept and load the server resource pack to play.'

menu_overrides:
  advancements:
    # On supported versions, intercept the client's advancement-tab packet and run this command as the player.
    # If the client does not send an advancement packet when opening the screen, vanilla behavior is left untouched.
    enabled: false
    command: 'profile'
    # Logs advancement-related inbound packet names/actions to help validate protocol behavior after Minecraft updates.
    debug: false

ui:
  tooltips:
    # Named popup styles. Each name can use different UI glyphs and positioning.
    # Omitted keys in a variant inherit the values from 'default'.
    default:
      left: 'voxel:tooltip_left'
      center: 'voxel:tooltip_center'
      right: 'voxel:tooltip_right'
      # Bitmap glyphs add one spacing pixel; overlapping by 1 closes each tile seam.
      tile_overlap: 1
      horizontal_padding: 4
      # Negative values pull letters and words closer together.
      letter_spacing: -1
      word_spacing: -1
      x_offset: 30
    # Example style: enable it and provide your own optional glyphs in your content pack.
    # warning:
    #   left: 'voxel:tooltip_warning_left'
    #   center: 'voxel:tooltip_warning_center'
    #   right: 'voxel:tooltip_warning_right'
    #   tile_overlap: 1
    #   horizontal_padding: 6
    #   x_offset: 30
  chest_titles:
    enabled: false
    # Full titles used for real physical chests. Normal VoxelCore UI/offset placeholders are supported.
    single: ''
    double: ''

  browser:
    # Inventory titles for /vc admin item ui and /vc admin block ui.
    # Supports & colors, VoxelCore :font_glyph: and :offset_<pixels>: placeholders.
    # {page} = current page (starts at 1), {pages} = total pages,
    # {total} = item/block count, {type} = Items or Blocks.
    # The placeholders expand BEFORE font glyph lookup, so names like
    # ':browser_items_page_{page}:' resolve to the correct page's texture.
    titles:
      items: 'VC Items {page}/{pages}'
      blocks: 'VC Blocks {page}/{pages}'
    # Optional exact page overrides, useful when every page has its own
    # background/font composition. Page numbers are 1-based.
    # If a page is not configured here, its 'titles' template applies.
    page_titles:
      items: {}
      blocks: {}
    # Bedrock inventory windows do not support Java bitmap glyph/negative-offset title art.
    # Use separate readable titles; Bedrock retains the inventory contents and click actions.
    # Supports & colors and {page}, {pages}, {total}, {type}, but not Java :glyph: aliases.
    bedrock_titles:
      items: 'VC Items {page}/{pages}'
      blocks: 'VC Blocks {page}/{pages}'
    bedrock_page_titles:
      items: {}
      blocks: {}
    # Example:
    # titles:
    #   items: '&f:offset_-8::vc_items_page_{page}:'
    #   blocks: '&f:offset_-8::vc_blocks_page_{page}:'
    # page_titles:
    #   items:
    #     '1': '&f:offset_-8::vc_item_browser_first_page:'
    #   blocks:
    #     '2': '&f:offset_-8::vc_block_browser_second_page:'

# Optional independent VaultUnlocked (Vault2) currencies.
# Essentials remains the legacy Coins provider; VoxelCore does not touch it.
economy:
  enabled: false
  currencies:
    tokens:
      decimals: 0

# Geyser v2 item mappings require Geyser API 2.9.3/build 1062 or newer.
# Packs are built on /vc admin pack build; distribution happens at Bedrock connection.
bedrock:
  # Automatically publish the pack + custom_mappings to the data folder of an
  # installed local Geyser-Spigot plugin. Does not guess paths to remote/proxy instances.
  # Set false to keep export-only behavior when geyser_data_directory is empty.
  auto_publish_local: true
  # Optional override. Empty = auto-detect Geyser-Spigot when installed in this server.
  # Absolute path recommended; relative paths use the server working directory.
  # Proxy/standalone Geyser needs a mounted path to its REAL data directory.
  # Example local override: 'plugins/Geyser-Spigot'
  geyser_data_directory: ''
  # Extra folders (relative to plugins/) scanned by '/voxelcore admin pack glyphs'
  # for literal glyphs in Bedrock's reserved U+E000..U+E1FF controller range.
  # VoxelCore content is always included. Migration rewrites fonts and references together.
  glyph_migration_roots:
    - DeluxeMenus
  # Remote/proxy Geyser (B17). When set (32+ characters, keep private), each Bedrock build
  # also exports a signed bundle served by the resource-pack host at /bedrock/ (requires
  # resource_pack.host.enabled). Put the same secret and the URL
  # (e.g. https://pack.example.net/bedrock) in the VoxelCore Geyser extension's
  # remote-sync.properties; it verifies the HMAC and digests and refuses rollbacks.
  remote_sync:
    secret: ''
