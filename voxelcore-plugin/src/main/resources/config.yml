version: 6 # DO NOT CHANGE
game:
  bedrock_support: false # Reserved for a future integration; currently has no runtime effect

menu_overrides:
  advancements:
    # On supported versions, intercept the client's advancement-tab packet and run this command as the player.
    # If the client does not send an advancement packet when opening the screen, vanilla behavior is left untouched.
    enabled: false
    command: 'profile'
    # Logs advancement-related inbound packet names/actions to help validate protocol behavior after Minecraft updates.
    debug: false

ui:
  tooltips:
    # Named popup styles. Each name can use different UI glyphs and positioning.
    # Omitted keys in a variant inherit the values from 'default'.
    default:
      left: 'voxel:tooltip_left'
      center: 'voxel:tooltip_center'
      right: 'voxel:tooltip_right'
      # Bitmap glyphs add one spacing pixel; overlapping by 1 closes each tile seam.
      tile_overlap: 1
      horizontal_padding: 4
      # Negative values pull letters and words closer together.
      letter_spacing: -1
      word_spacing: -1
      x_offset: 30
    # Example style: enable it and provide your own optional glyphs in your content pack.
    # warning:
    #   left: 'voxel:tooltip_warning_left'
    #   center: 'voxel:tooltip_warning_center'
    #   right: 'voxel:tooltip_warning_right'
    #   tile_overlap: 1
    #   horizontal_padding: 6
    #   x_offset: 30
  chest_titles:
    enabled: false
    # Full titles used for real physical chests. Normal VoxelCore UI/offset placeholders are supported.
    single: ''
    double: ''

# Optional multi-currency VoxelCore economy. Disabled until admin explicitly enables it.
# Changes to currency precision or maximum after first initialization need a migration.
economy:
  enabled: false
  currencies:
    'voxel:coins':
      name: Coins
      precision: 2
      maximum-balance: '1000000000000'
    'voxel:cosmetics':
      name: Cosmetic Tokens
      precision: 0
      maximum-balance: '1000000000'
