items:
  base:
    material: minecraft:diamond_hoe
    display_name: Base MVP Item
    bound: true
    lore:
      - Loaded from the VoxelCore numeric MVP fixture

  red_item:
    extends: base
    display_name: Red Test Item
    render:
      model: voxeltest:item/red_item
      unbreakable: true
      durability: 1
      attributes:
        hide_enchantments: true
        hide_attributes: true
        hide_unbreakable: true
      custom_model_data: 5
    events:
      interact:
        right:
          actions:
            - type: set_block
              block: red_ore
              target: relative
              replace: air_only
              consume: 1

  child_item:
    extends: red_item
    display_name: Inherited Test Item
    bound: false

blocks:
  red_ore:
    method: auto
    model: cube_all
    texture: voxeltest:item/red_item
    drop: red_item
    silk_touch: red_item
    hardness: 3.0
    blast_resistance: 3.0
